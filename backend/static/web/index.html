<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VisemePal 开发控制台</title>
  <link rel="stylesheet" href="/static/web/app.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
    }
  }
  </script>
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">开发控制台 · TalkingHead 写实数字人 · Oculus viseme 口型</p>
      <h1>VisemePal</h1>
    </div>
    <div class="status" id="status">
      <span class="pill">检测中…</span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button type="button" class="active" data-tab="practice">跟读评测</button>
    <button type="button" data-tab="viseme">数字人 / 舌位</button>
    <button type="button" data-tab="records">练习记录</button>
    <button type="button" data-tab="plan">训练计划</button>
  </nav>

  <main>
    <section id="practice" class="panel active">
      <div class="grid two">
        <article class="card">
          <h2>课程</h2>
          <p class="hint">选一课，真人 3D 数字人按音素做口型；右侧是舌位示意图。可换形象，也可粘贴 Ready Player Me 模型链接。</p>
          <div class="row look-row" data-looks></div>
          <div class="row avatar-url-row">
            <input id="avatar-url" type="url" placeholder="Ready Player Me 模型链接或 ID" />
            <button type="button" id="avatar-url-apply">加载自定义形象</button>
          </div>
          <div id="lessons" class="lesson-list">加载中…</div>
        </article>
        <article class="card">
          <h2 id="practice-title">先选一课</h2>
          <p id="practice-meta" class="hint"></p>
          <div class="avatar-row">
            <figure>
              <div class="avatar-stage" id="practice-front">
                <p class="avatar-loading">正在加载真人数字人…</p>
              </div>
              <figcaption>正面口型</figcaption>
            </figure>
            <figure>
              <canvas id="practice-side" width="280" height="380"></canvas>
              <figcaption>侧面 + 舌位图</figcaption>
            </figure>
          </div>
          <div id="practice-track" class="phone-track"></div>
          <audio id="demo-audio" controls hidden></audio>
          <div class="row">
            <button type="button" id="play-demo" disabled>数字人示范</button>
            <button type="button" id="rec-btn" disabled>开始录音</button>
            <label class="file-btn">
              上传音频
              <input id="file-input" type="file" accept="audio/*,.wav,.m4a,.mp3,.webm" hidden />
            </label>
            <button type="button" class="primary" id="eval-btn" disabled>评测</button>
          </div>
          <p id="rec-state" class="hint"></p>
          <div id="result" class="result empty">评测结果会出现在这里。</div>
        </article>
      </div>
    </section>

    <section id="viseme" class="panel">
      <div class="grid two">
        <article class="card">
          <h2>音素资源库</h2>
          <p class="hint">点音素让真人数字人停在对应口型。形象与跟读页共用，可换成自己的 Ready Player Me 模型。</p>
          <div class="row look-row" data-looks></div>
          <div id="phonemes" class="chip-list">加载中…</div>
        </article>
        <article class="card viseme-card">
          <h2>口型 + 舌位</h2>
          <div class="avatar-row">
            <figure>
              <div class="avatar-stage" id="inspect-front">
                <p class="avatar-loading">正在加载真人数字人…</p>
              </div>
              <figcaption>正面口型</figcaption>
            </figure>
            <figure>
              <canvas id="inspect-side" width="280" height="380"></canvas>
              <figcaption>侧面 + 舌位图</figcaption>
            </figure>
          </div>
          <div id="viseme-text" class="result empty">点左侧音素查看口型和舌位。</div>
        </article>
      </div>
    </section>

    <section id="records" class="panel">
      <div class="grid two">
        <article class="card">
          <h2>统计</h2>
          <div id="stats">加载中…</div>
        </article>
        <article class="card">
          <h2>最近记录</h2>
          <div id="record-list">加载中…</div>
        </article>
      </div>
    </section>

    <section id="plan" class="panel">
      <article class="card">
        <div class="row">
          <h2>个性化训练计划</h2>
          <button type="button" id="refresh-plan">重新生成</button>
        </div>
        <p id="plan-source" class="hint"></p>
        <div id="plan-body">加载中…</div>
      </article>
    </section>
  </main>

  <script type="module" src="/static/web/app.js"></script>
</body>
</html>
